# Application Port
server.port=${PORT:8080}

# Application Name
spring.application.name=scholarhub-backend

# MySQL Datasource Configuration (with environment variable overrides for production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scholarhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hibernate creates and updates tables automatically; schema.sql is provided for manual MySQL DBA setup
spring.sql.init.mode=never

# Global CORS Configuration (comma-separated allowed origins)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Logging
logging.level.com.scholarhub=INFO
